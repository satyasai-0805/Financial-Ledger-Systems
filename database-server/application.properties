# Database Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2006}

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8080}
spring.main.banner-mode=off

# AI Assistant Service Config
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:llama3.2}
ai.cloud.api-key=${AI_CLOUD_API_KEY:}
ai.cloud.endpoint=${AI_CLOUD_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
ai.cloud.model=${AI_CLOUD_MODEL:llama-3.3-70b-versatile}


